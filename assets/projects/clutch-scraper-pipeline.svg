<svg xmlns="http://www.w3.org/2000/svg" width="580" height="232" viewBox="0 0 580 232" fill="none" role="img" aria-labelledby="title">
<title id="title">Clutch Scraper Pipeline: Scrapes a Clutch directory, enriches the top 20 companies with founder and client data, scores each 0-100 and drafts outreach emails. Parallel enrichment, ~30-40 s end to end.</title>
<style>
  .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  .pulse { animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  .flow { stroke-dasharray: 3 5; animation: flow 1.2s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -16; } }

  .scan { stroke-dasharray: 70 930; animation: scan 9s linear infinite; }
  @keyframes scan { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs><clipPath id="frame"><rect width="580" height="232" rx="16"/></clipPath></defs>
<rect x=".5" y=".5" width="579" height="231" rx="16" fill="#000000" stroke="#1f1f1f"/>
<g clip-path="url(#frame)">
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" opacity=".09"/></pattern>
  <radialGradient id="fadeGrad" cx=".9" cy=".1" r=".7"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
  <mask id="fade"><rect width="580" height="232" fill="url(#fadeGrad)"/></mask>
</defs>
<rect width="580" height="232" fill="url(#dots)" mask="url(#fade)"/>
<rect class="scan" style="animation-delay:-6s" x="1" y="1" width="578" height="230" rx="15" stroke="#fafafa" stroke-width="1.5" pathLength="1000"/>
<circle class="pulse" cx="32" cy="34" r="3.5" fill="#fafafa"/>
<text x="44" y="38" font-size="11" class="mono" textLength="99.0" lengthAdjust="spacingAndGlyphs" fill="#737373">0x05  ·  PYTHON</text>
<text x="321" y="38" font-size="11" class="mono" textLength="231.0" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">RK-Rohan/clutch-scraper-pipeline  ↗</text>
<text x="28" y="80" font-size="24" font-weight="700" letter-spacing="-.4" class="sans" fill="#fafafa">Clutch Scraper Pipeline</text>
<text x="28" y="110" font-size="14" class="sans" fill="#a3a3a3">Scrapes a Clutch directory, enriches the top 20 companies with</text>
<text x="28" y="131" font-size="14" class="sans" fill="#a3a3a3">founder and client data, scores each 0-100 and drafts outreach</text>
<text x="28" y="152" font-size="14" class="sans" fill="#a3a3a3">emails. Parallel enrichment, ~30-40 s end to end.</text>
<rect x="28" y="182" width="59.6" height="24" rx="6" fill="#0a0a0a" stroke="#262626"/><text x="38" y="197.96" font-size="11" class="mono" textLength="39.6" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">Python</text>
<rect x="93.6" y="182" width="105.8" height="24" rx="6" fill="#0a0a0a" stroke="#262626"/><text x="103.6" y="197.96" font-size="11" class="mono" textLength="85.8" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">BeautifulSoup</text>
<rect x="205.39999999999998" y="182" width="99.2" height="24" rx="6" fill="#0a0a0a" stroke="#262626"/><text x="215.39999999999998" y="197.96" font-size="11" class="mono" textLength="79.2" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">cloudscraper</text>
<rect x="310.59999999999997" y="182" width="66.2" height="24" rx="6" fill="#0a0a0a" stroke="#262626"/><text x="320.59999999999997" y="197.96" font-size="11" class="mono" textLength="46.2" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">Threads</text>
</g>
