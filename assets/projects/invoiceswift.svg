<svg xmlns="http://www.w3.org/2000/svg" width="580" height="232" viewBox="0 0 580 232" fill="none" role="img" aria-labelledby="title">
<title id="title">InvoiceSwift: Invoicing app with sign-up and login, client management, invoice create / edit / view, reusable templates and a dashboard, plus a Genkit AI flow for customising invoice templates.</title>
<style>
  .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  .pulse { animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  .flow { stroke-dasharray: 3 5; animation: flow 1.2s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -16; } }

  .scan { stroke-dasharray: 70 930; animation: scan 9s linear infinite; }
  @keyframes scan { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs><clipPath id="frame"><rect width="580" height="232" rx="16"/></clipPath></defs>
<rect x=".5" y=".5" width="579" height="231" rx="16" fill="#000000" stroke="#1f1f1f"/>
<g clip-path="url(#frame)">
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" opacity=".09"/></pattern>
  <radialGradient id="fadeGrad" cx=".9" cy=".1" r=".7"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
  <mask id="fade"><rect width="580" height="232" fill="url(#fadeGrad)"/></mask>
</defs>
<rect width="580" height="232" fill="url(#dots)" mask="url(#fade)"/>
<rect class="scan" style="animation-delay:-1.5s" x="1" y="1" width="578" height="230" rx="15" stroke="#fafafa" stroke-width="1.5" pathLength="1000"/>
<circle class="pulse" cx="32" cy="34" r="3.5" fill="#fafafa"/>
<text x="44" y="38" font-size="11" class="mono" textLength="125.4" lengthAdjust="spacingAndGlyphs" fill="#737373">0x02  ·  TYPESCRIPT</text>
<text x="393.6" y="38" font-size="11" class="mono" textLength="158.4" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">RK-Rohan/InvoiceSwift  ↗</text>
<text x="28" y="80" font-size="24" font-weight="700" letter-spacing="-.4" class="sans" fill="#fafafa">InvoiceSwift</text>
<text x="28" y="110" font-size="14" class="sans" fill="#a3a3a3">Invoicing app with sign-up and login, client management, invoice</text>
<text x="28" y="131" font-size="14" class="sans" fill="#a3a3a3">create / edit / view, reusable templates and a dashboard, plus a</text>
<text x="28" y="152" font-size="14" class="sans" fill="#a3a3a3">Genkit AI flow for customising invoice templates.</text>
<rect x="28" y="182" width="86.0" height="24" rx="6" fill="#0a0a0a" stroke="#262626"/><text x="38" y="197.96" font-size="11" class="mono" textLength="66.0" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">Next.js 15</text>
<rect x="120" y="182" width="72.8" height="24" rx="6" fill="#0a0a0a" stroke="#262626"/><text x="130" y="197.96" font-size="11" class="mono" textLength="52.8" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">NextAuth</text>
<rect x="198.8" y="182" width="66.2" height="24" rx="6" fill="#0a0a0a" stroke="#262626"/><text x="208.8" y="197.96" font-size="11" class="mono" textLength="46.2" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">MongoDB</text>
<rect x="271" y="182" width="59.6" height="24" rx="6" fill="#0a0a0a" stroke="#262626"/><text x="281" y="197.96" font-size="11" class="mono" textLength="39.6" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">Genkit</text>
</g>
</svg>
