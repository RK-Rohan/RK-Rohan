  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  .pulse { animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  .flow { stroke-dasharray: 3 5; animation: flow 1.2s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -16; } }

  .role { opacity: 0; animation: role 15s infinite; }
  @keyframes role { 0% { opacity: 1; transform: none; } 17.50% { opacity: 1; transform: none; }
    20.00% { opacity: 0; transform: translateY(-10px); } 97.5% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: none; } }
  .caret { animation: caret 1s steps(1) infinite; }
  @keyframes caret { 50% { opacity: 0; } }
  .ticker { animation: ticker 65.1s linear infinite; }
  @keyframes ticker { to { transform: translateX(-2930.4px); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
